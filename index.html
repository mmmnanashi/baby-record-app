<style>
:root{--bg:#ffeef4;--card:#fff;--ink:#5a3e4a;--sub:#a88d98;--line:#f8dfe8;--feed:#ffa94d;--sleep:#7aa7ff;--diaper:#4cd1a4;--temp:#ff6b8b;--memo:#b58cff;--g-feed:linear-gradient(135deg,#ffd166,#ff8c42);--g-sleep:linear-gradient(135deg,#a5d8ff,#6c8cff);--g-diaper:linear-gradient(135deg,#8ff0c8,#2fd19a);--g-temp:linear-gradient(135deg,#ffb3c6,#ff5c8a);--g-memo:linear-gradient(135deg,#e0c3ff,#a98bff)}

5.7 -2.9,1.0 -6.7,-2.2 -1.8,-2.5'/%3E%3Cpolygon transform='translate(226 242) rotate(6) scale(1.26)' fill='%23ffffff' opacity='0.76' stroke='%23ffffff' stroke-width='1.6' stroke-linejoin='round' points='0.0,-7.0 1.8,-2.5 6.7,-2.2 2.9,1.0 4.1,5.7 0.0,3.1 -4.1,5.7 -2.9,1.0 -6.7,-2.2 -1.8,-2.5'/%3E%3Cpolygon transform='translate(520 547) rotate(5) scale(0.56)' fill='%23ffd0dd' opacity='0.81' stroke='%23ffd0dd' stroke-width='1.6' stroke-linejoin='round' points='0.0,-7.0 1.8,-2.5 6.7,-2.2 2.9,1.0 4.1,5.7 0.0,3.1 -4.1,5.7 -2.9,1.0 -6.7,-2.2 -1.8,-2.5'/%3E%3Ccircle cx='351' cy='46' r='1.5' fill='%23ffffff' opacity='0.80'/%3E%3Ccircle cx='43' cy='236' r='1.5' fill='%23ffffff' opacity='0.57'/%3E%3Ccircle cx='212' cy='326' r='1.4' fill='%23ffffff' opacity='0.56'/%3E%3Ccircle cx='258' cy='190' r='2.2' fill='%23ffd0dd' opacity='0.73'/%3E%3Ccircle cx='83' cy='24' r='1.2' fill='%23ffffff' opacity='0.78'/%3E%3Ccircle cx='546' cy='16' r='2.1' fill='%23ffe08a' opacity='0.53'/%3E%3Ccircle cx='179' cy='81' r='1.3' fill='%23ffe08a' opacity='0.72'/%3E%3C/svg%3E");background-size:233px 233px,389px 389px,571px 571px;background-position:0 0,97px 151px,263px 41px;background-attachment:fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(96px + env(safe-area-inset-bottom))}
header{text-align:center;padding:10px 0 4px}
.deco{width:100%;max-width:300px;margin:0 auto;animation:float 4s ease-in-out infinite}
.deco svg{display:block;width:100%;height:auto}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.card h3::before{content:'✦ ';color:#ff8fab}
.stat{position:relative;overflow:hidden}
.stat::after{content:'★';position:absolute;right:10px;top:6px;color:#ffd6e5;font-size:16px}
.empty::before{content:'';display:block;width:64px;height:64px;margin:0 auto 6px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Cg stroke=%22%23a8846b%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M17 22C13 14 13 4 18 3s6 9 5 19z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M31 22c4-8 4-18-1-19s-6 9-5 19z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M18.2 18c-1.8-5-1.6-10 .4-11.5M29.8 18c1.8-5 1.6-10-.4-11.5%22 fill=%22none%22 stroke=%22%23ffc2d4%22 stroke-width=%222.6%22/%3E%3Cellipse cx=%2224%22 cy=%2231%22 rx=%2215%22 ry=%2213%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2218.5%22 cy=%2230%22 r=%221.7%22 fill=%22%23a8846b%22 stroke=%22none%22/%3E%3Ccircle cx=%2229.5%22 cy=%2230%22 r=%221.7%22 fill=%22%23a8846b%22 stroke=%22none%22/%3E%3Cpath d=%22M22.5 33.5l1.5 1.2 1.5-1.2%22 fill=%22none%22 stroke-width=%221.8%22/%3E%3Cpath d=%22M21 36.5q1.5 1.5 3 0q1.5 1.5 3 0%22 fill=%22none%22 stroke-width=%221.8%22/%3E%3Cellipse cx=%2214%22 cy=%2234.5%22 rx=%222.6%22 ry=%221.8%22 fill=%22%23ffc2d4%22 stroke=%22none%22/%3E%3Cellipse cx=%2234%22 cy=%2234.5%22 rx=%222.6%22 ry=%221.8%22 fill=%22%23ffc2d4%22 stroke=%22none%22/%3E%3Cpath d=%22M33 13l1.4 2.8 3 .4-2.2 2.1.5 3-2.7-1.4-2.7 1.4.5-3-2.2-2.1 3-.4z%22 fill=%22%23ffe08a%22 stroke-width=%221.4%22 transform=%22translate(6 -9)%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;animation:hop 2.4s ease-in-out infinite}@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}90%{transform:translateY(0)}}
header h1{margin:0;font-size:22px;font-weight:800;color:var(--ink)}
header .sub{color:var(--sub);font-size:13px;margin-top:2px}
h3{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.card{background:var(--card);border-radius:24px;padding:14px 16px;margin-top:12px;box-shadow:0 2px 10px rgba(120,80,60,.07)}
.act-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.act{border:0;border-radius:24px;padding:14px 2px 12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 16px -4px rgba(255,107,139,.35);text-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .15s}
.act b{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:26px;line-height:1;text-shadow:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.act:active{transform:scale(.96)}
.banner{background:linear-gradient(135deg,#8fb6ff,#7aa7ff);color:#fff;border-radius:18px;padding:12px 16px;margin-top:12px;box-shadow:0 3px 10px rgba(122,167,255,.35)}
.banner small{opacity:.9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(120,80,60,.07)}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .v small{font-size:13px;font-weight:400}
.stat .d{font-size:11px;color:var(--sub)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tl li:first-child{border-top:0}
.tl .time{width:46px;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.tl .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 8px -2px rgba(0,0,0,.15),inset 0 -2px 0 rgba(0,0,0,.08)}
.tl .txt{flex:1;min-width:0}
.tl .txt small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--sub);text-align:center;padding:20px 0;font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:9px;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bars{height:150px;display:flex;gap:3px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.col .val{height:16px;font-size:10px;color:var(--sub);text-align:center;white-space:nowrap;overflow:hidden}
.col .plot{flex:1;display:flex;align-items:flex-end}
.col .bar{width:100%;border-radius:6px 6px 2px 2px;min-height:2px}
.col .lb{height:18px;font-size:10px;color:var(--sub);text-align:center}
.rail-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.rail-row .d{width:40px;color:var(--sub);font-variant-numeric:tabular-nums}
.rail{position:relative;flex:1;height:18px;background:var(--line);border-radius:6px;overflow:hidden}
.rail .s{position:absolute;top:0;bottom:0;background:var(--sleep);opacity:.85}
.rail .f{position:absolute;top:3px;width:6px;height:12px;margin-left:-3px;border-radius:3px;background:var(--feed)}
.axis{flex:1;display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.range{display:flex;gap:6px;margin-top:12px}
.range button{flex:1;border:0;background:var(--card);border-radius:12px;padding:8px 0;cursor:pointer;color:var(--sub);font-size:13px}
.range button.on{background:var(--ink);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom));color:var(--sub);font-size:12px;cursor:pointer}
nav button.on{color:var(--ink);font-weight:700}
nav button span{display:block;font-size:22px;transition:transform .2s}
nav button.on span{transform:scale(1.25)}
.ov{position:fixed;inset:0;background:rgba(60,40,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px 24px;max-height:90vh;overflow:auto}
.sheet h3{color:var(--ink);font-size:17px;margin-bottom:12px}
.sheet label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.sheet input,.sheet textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fffdfb;color:var(--ink)}
.sheet textarea{min-height:60px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;border:0;border-radius:14px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:linear-gradient(135deg,#ff8fab,#ff6b8b);color:#fff;box-shadow:0 6px 14px -4px rgba(255,107,139,.5)}
.ghost{background:var(--bg);color:var(--ink)}
.danger{background:#ffe3e3;color:#c94545}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.set-row{margin-top:10px}
.set-row label{font-size:13px;color:var(--sub);display:block}
.set-row input{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit}
.linkbtn{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px;cursor:pointer;color:var(--ink)}
.linkbtn.warn{color:#c94545}

.ic{display:block;width:100%;height:100%}
.act b{width:54px;height:54px;background:#fff;padding:7px;box-shadow:0 3px 0 rgba(0,0,0,.08),inset 0 -2px 0 rgba(0,0,0,.05)}
.act:hover b{transform:rotate(-6deg) scale(1.05)}
.act b{transition:transform .2s}
.tl .dot{padding:4px}
.tl .dot .ic{background:#fff;border-radius:50%;padding:3px}
.bn-ic{display:flex;align-items:center;gap:8px;font-weight:700}
.bn-ic .ic{width:30px;height:30px;background:#fff;border-radius:50%;padding:3px}
nav button span.nv{width:30px;height:30px;margin:0 auto 2px;opacity:.55;transition:transform .2s,opacity .2s}
nav button.on span.nv{opacity:1}
.fh{display:flex;align-items:center;gap:10px}
.fh-ic{width:44px;height:44px;border-radius:50%;padding:4px;flex-shrink:0}
.fh-ic .ic{background:#fff;border-radius:50%;padding:3px}

header h1{display:flex;align-items:center;justify-content:center;gap:8px}
.baby-wrap{width:40px;height:40px;flex-shrink:0;animation:wiggle 3s ease-in-out infinite}
.baby{display:block;width:100%;height:100%}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

body:not([data-screen="app"]) nav{display:none}
#v-loading{padding:60px 0}
.loading{display:flex;justify-content:center;gap:8px}
.loading span{width:12px;height:12px;border-radius:50%;background:#ff9fb8;animation:bounce 1s infinite ease-in-out}
.loading span:nth-child(2){animation-delay:.15s;background:#ffd166}
.loading span:nth-child(3){animation-delay:.3s;background:#9fc3ff}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.login{text-align:center;padding:28px 22px 26px;margin-top:20px}
.login-art{width:96px;height:96px;margin:0 auto 6px;animation:wiggle 3s ease-in-out infinite}
.login-art svg{width:100%;height:100%}
.login h2{font-size:19px;margin:6px 0 8px;line-height:1.5}
.note{color:var(--sub);font-size:13px;margin:0 0 6px}
.gbtn{display:inline-flex;align-items:center;gap:10px;margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 6px 14px -6px rgba(255,107,139,.45)}
.gbtn:active{transform:scale(.97)}
.hello{display:flex;align-items:center;gap:12px}
.hello-ic{width:52px;height:52px;flex-shrink:0}
.hello-ic svg{width:100%;height:100%}
.hello small{display:block;color:var(--sub);font-size:13px;font-weight:400}
.code-in{text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.linkbtn.center{text-align:center;background:none;color:var(--sub);text-decoration:underline}
.code-box{margin:14px 0 4px;text-align:center;font-size:32px;font-weight:800;letter-spacing:.12em;background:var(--bg);border:2px dashed #ffb3c6;border-radius:16px;padding:14px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.members{list-style:none;margin:0;padding:0}
.members li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.members li:first-child{border-top:0}
.members small{margin-left:6px;font-size:11px;background:var(--bg);color:#ff6b8b;border-radius:999px;padding:2px 8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--g-temp);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.tl .who{color:#ff8fab}
.h-ic{display:flex;align-items:center;gap:6px}
.h-ic span{width:22px;height:22px;display:inline-block}
.card h3.h-ic::before{content:none}
button:disabled{opacity:.5;pointer-events:none}
.err-box{background:#fff3f5;border:1px solid #ffd0dd;border-radius:12px;padding:10px 12px;font-size:12px;color:#c94545;word-break:break-all;margin-top:8px}
</style>
